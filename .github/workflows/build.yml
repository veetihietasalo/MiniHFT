name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1.1

    - name: Build Ring Buffer Benchmark
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cl /EHsc /std:c++20 /O2 /I include src\ring_bench.cpp /Fe:ring_bench.exe
      shell: cmd

    - name: Build ITCH Parser Test
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cl /EHsc /std:c++20 /I include src\gen_itch.cpp /Fe:gen_itch.exe
        cl /EHsc /std:c++20 /I include src\itch_test.cpp /Fe:itch_test.exe
      shell: cmd

    - name: Build Hardware Benchmark
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cl /EHsc /std:c++20 /O2 /I include src\hw_bench.cpp /Fe:hw_bench.exe
      shell: cmd

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential cmake

    - name: Build with CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
