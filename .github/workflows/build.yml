name: Build and Test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, preset: msvc-release }
          - { os: ubuntu-24.04, preset: gcc-release }
          - { os: ubuntu-24.04, preset: clang-tsan }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # TSan can't map its shadow memory with the high ASLR entropy newer kernels use.
      - name: Lower ASLR entropy for ThreadSanitizer
        if: matrix.preset == 'clang-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
